<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17233c">
<link rel="manifest" href="manifest.webmanifest">
<title>Isa Run & Strength V5</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#17233c;--muted:#66738b;--line:#e2e7f0;--accent:#3157d5;--soft:#eef2ff;--green:#16845b;--orange:#b36a00;--red:#c94b4b;--shadow:0 8px 28px rgba(23,35,60,.08)}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(145deg,#17233c,#2d4772);color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:5}
h1{font-size:25px;margin:0 0 5px} h2{font-size:19px;margin:0 0 12px} h3{font-size:16px;margin:0 0 9px}.sub{opacity:.8;font-size:13px}
nav{display:flex;gap:8px;margin-top:15px;overflow:auto}nav button{border:0;border-radius:18px;padding:9px 13px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}nav button.active{background:#fff;color:var(--ink)}
main{max-width:760px;margin:auto;padding:16px 14px 90px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:12px;border-radius:14px;background:var(--soft)}.stat b{font-size:20px;display:block}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.badge{display:inline-block;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700}.green{background:#e7f6ef;color:var(--green)}.orange{background:#fff2dc;color:var(--orange)}.red{background:#ffe9e9;color:var(--red)}.blue{background:#eaf0ff;color:var(--accent)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:var(--muted);font-size:13px}
.day{padding:12px;border:1px solid var(--line);border-radius:14px;margin:8px 0}.day.current{border:2px solid var(--accent)}.day strong{display:block}.day small{color:var(--muted)}
button.primary{width:100%;border:0;background:var(--accent);color:white;border-radius:13px;padding:12px;font-weight:700}button.secondary{border:1px solid var(--line);background:white;color:var(--ink);border-radius:11px;padding:9px 11px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:75px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exercise{border-top:1px solid var(--line);padding:14px 0}.exercise:first-child{border-top:0}.exercise-head{display:flex;justify-content:space-between;gap:10px}.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.set label{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}.set input{padding:8px 5px;text-align:center}
.notice{padding:12px;border-radius:13px;background:#f3f6fb;color:#43516b;font-size:13px}.tiny{font-size:11px;color:var(--muted)}
.hidden{display:none!important}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:6}
.footerin{max-width:760px;margin:auto;display:flex;gap:8px}.footerin button{flex:1;border:0;background:transparent;padding:8px;color:var(--muted)}.footerin button.active{color:var(--accent);font-weight:700}
@media(max-width:520px){.sets{grid-template-columns:repeat(3,1fr)}.formgrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>Isa Run & Strength</h1>
  <div class="sub">V5 · corrida + musculação · progressão por carga e repetições</div>
  <nav id="weekNav"></nav>
</header>
<main>
<section id="home"></section>
<section id="run" class="hidden"></section>
<section id="strength" class="hidden"></section>
<section id="history" class="hidden"></section>
</main>
<footer><div class="footerin">
<button data-tab="home">🏠<br><span>Hoje</span></button>
<button data-tab="run">🏃‍♀️<br><span>Corrida</span></button>
<button data-tab="strength">🏋️<br><span>Musculação</span></button>
<button data-tab="history">📈<br><span>Histórico</span></button>
</div></footer>

<script>
const DAYS=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
const SHORT=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
const weekKey="isa-v5-week";
let selectedWeek=Number(localStorage.getItem(weekKey)||2);
const currentDay=new Date().getDay();
const currentISO=new Date().toISOString().slice(0,10);

const runsDefault={
  0:{type:"Descanso",km:0,intensity:"—",note:"Recuperação"},
  1:{type:"Descanso",km:0,intensity:"—",note:""},
  2:{type:"Corrida leve",km:0,intensity:"Leve",note:"Ajustar conforme Grit Run"},
  3:{type:"Intervalado",km:7.2,intensity:"Alta",note:"2 × 4×400 m · 400 m forte · recuperação 1:15"},
  4:{type:"Descanso",km:0,intensity:"—",note:""},
  5:{type:"Corrida leve",km:5.5,intensity:"Leve",note:"5–6 km"},
  6:{type:"Longo",km:14,intensity:"Moderada/leve",note:"14 km confortável"}
};
let runs=JSON.parse(localStorage.getItem("isa-v5-runs")||"null")||runsDefault;

const sessions={
 A:{name:"Upper + Core",level:"Hipertrofia",ex:[
  ["Supino inclinado com halteres",3,"8–10",10],["Remada baixa",3,"8–10",30],["Desenvolvimento sentado",3,"8–10",14],["Elevação lateral",3,"10–15",10],["Tríceps",2,"10–12",20],["Rosca alternada",2,"10–12",6],["Dead Bug",2,"10/lado",0]
 ]},
 B:{name:"Pernas — força controlada",level:"Força/hipertrofia",ex:[
  ["Stiff / RDL",3,"6–8",30],["Leg Press 45°",3,"8–10",120],["Hip Thrust",3,"8–10",40],["Mesa flexora",2,"10–12",35],["Cadeira extensora",2,"10–12",36],["Búlgaro",2,"8–10/perna",10],["Panturrilha",3,"10–15",30]
 ]},
 C:{name:"Upper — manutenção + hipertrofia",level:"Moderada",ex:[
  ["Puxada barra aberta",3,"8–12",25],["Remada unilateral",3,"8–12",30],["Supino / máquina",3,"8–12",0],["Crucifixo inverso",2,"10–15",23],["Elevação lateral",2,"12–15",10],["Rosca direta",2,"10–12",15],["Prancha",2,"30–45s",0]
 ]},
 D:{name:"Pernas — hipertrofia controlada",level:"Moderada",ex:[
  ["Agachamento búlgaro",2,"8–10/perna",10],["Elevação de quadril",3,"8–12",40],["Cadeira flexora",2,"10–12",35],["Cadeira abdutora",2,"12–15",63],["Glúteo na polia",2,"12–15",15],["Panturrilha",2,"12–15",30],["Abdominal escalador",2,"10–12",10]
 ]},
 E:{name:"Upper + glúteo/estabilidade",level:"Leve",ex:[
  ["Puxada",2,"10–12",25],["Face Pull",2,"12–15",25],["Elevação lateral",2,"12–15",10],["Glúteo na polia",2,"12–15",15],["Abdutora",2,"15–20",63],["Core unilateral",2,"10/lado",0]
 ]}
};
const schedule={1:"A",2:"B",3:"C",4:"D",5:"E",6:null,0:null};

function runLoad(day){
 const r=runs[day]||{}; let km=Number(r.km||0);
 if(r.type==="Longo") return 3;
 if(r.type==="Intervalado"||r.intensity==="Alta") return 3;
 if(r.type==="Corrida leve"&&km>0) return 1;
 return 0;
}
function muscleAdvice(day){
 const code=schedule[day];
 if(!code) return {code:null,text:day===6?"Longão: sem musculação pesada.": "Descanso / recuperação."};
 let text="";
 if(day===2 && runLoad(3)>=3) text="Quarta tem intervalado forte. Mantenha 2–3 RIR e não busque falha nas pernas.";
 if(day===4 && runLoad(6)>=3) text="Sábado tem longão. Volume de pernas controlado; priorize técnica e recuperação.";
 if(day===5) text="Corrida leve + musculação complementar. Evite fadiga residual antes do longão.";
 if(day===1) text="Dia estratégico para upper + core: use a segunda sem sobrecarregar as pernas.";
 return {code,text:text||"Siga a sessão prevista e ajuste pela recuperação."};
}
function fmtDate(d){return new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"2-digit"}).format(d)}
function renderNav(){
 const el=document.getElementById("weekNav"); el.innerHTML="";
 for(let w=1;w<=4;w++){let b=document.createElement("button");b.textContent="Semana "+w;b.className=w===selectedWeek?"active":"";b.onclick=()=>{selectedWeek=w;localStorage.setItem(weekKey,w);renderAll()};el.appendChild(b)}
}
function renderHome(){
 const advice=muscleAdvice(currentDay), r=runs[currentDay]||{};
 const title=advice.code?`Treino ${advice.code} — ${sessions[advice.code].name}`:(currentDay===6?"Longão":"Recuperação");
 let runBadge=runLoad(currentDay)>=3?"red":runLoad(currentDay)===1?"orange":"green";
 let html=`<div class="card"><div class="row"><div><div class="label">Hoje</div><h2>${DAYS[currentDay]}</h2><div class="muted">${fmtDate(new Date())} · Semana ${selectedWeek}</div></div><span class="badge ${runBadge}">${r.type||"—"}</span></div></div>`;
 html+=`<div class="grid"><div class="stat"><span class="label">Corrida</span><b>${r.km?Number(r.km).toLocaleString("pt-BR")+" km":"—"}</b><span class="muted">${r.intensity||""}</span></div><div class="stat"><span class="label">Musculação</span><b>${advice.code||"—"}</b><span class="muted">${advice.code?sessions[advice.code].level:"Descanso"}</span></div></div>`;
 html+=`<div class="card"><div class="label">Recomendação de hoje</div><h2>${title}</h2><div class="notice">${advice.text}</div>${advice.code?`<button class="primary" style="margin-top:12px" onclick="openStrength('${advice.code}')">Abrir treino</button>`:""}</div>`;
 html+=`<div class="card"><h2>Semana ${selectedWeek}</h2>${[1,2,3,4,5,6,0].map(d=>dayCard(d)).join("")}</div>`;
 document.getElementById("home").innerHTML=html;
}
function dayCard(d){
 const r=runs[d]||{}; const adv=muscleAdvice(d); const cls=d===currentDay?"day current":"day";
 return `<div class="${cls}"><div class="row"><strong>${DAYS[d]}</strong><span class="badge ${runLoad(d)>=3?"red":runLoad(d)===1?"orange":"green"}">${r.type||"Descanso"}</span></div><small>${r.km?Number(r.km).toLocaleString("pt-BR")+" km · ":""}${r.intensity||""}${adv.code?" · Musculação "+adv.code:""}</small></div>`;
}
function renderRun(){
 let html=`<div class="card"><h2>🏃‍♀️ Semana de corrida</h2><div class="notice">O Grit Run é a fonte oficial. Edite aqui a programação recebida do professor. O app cruza intensidade, distância e proximidade dos treinos para ajustar a musculação.</div></div>`;
 [1,2,3,4,5,6,0].forEach(d=>{
  const r=runs[d]||{type:"Descanso",km:0,intensity:"—",note:""};
  html+=`<div class="card"><div class="row"><h2>${DAYS[d]}</h2><span class="badge ${runLoad(d)>=3?"red":runLoad(d)===1?"orange":"green"}">${r.type}</span></div>
  <div class="formgrid"><div><label class="tiny">Tipo</label><select data-run-day="${d}" data-k="type">${["Descanso","Corrida leve","Intervalado","Tempo/limiar","Longo","Regenerativo"].map(x=>`<option ${x===r.type?"selected":""}>${x}</option>`).join("")}</select></div>
  <div><label class="tiny">Km</label><input data-run-day="${d}" data-k="km" type="number" step=".1" value="${r.km||0}"></div>
  <div><label class="tiny">Intensidade</label><select data-run-day="${d}" data-k="intensity">${["—","Leve","Moderada/leve","Moderada","Alta"].map(x=>`<option ${x===r.intensity?"selected":""}>${x}</option>`).join("")}</select></div>
  <div><label class="tiny">Observação</label><input data-run-day="${d}" data-k="note" value="${r.note||""}"></div></div></div>`;
 });
 document.getElementById("run").innerHTML=html;
 document.querySelectorAll("[data-run-day]").forEach(i=>i.addEventListener("change",e=>{const d=e.target.dataset.runDay,k=e.target.dataset.k;runs[d]=runs[d]||{};runs[d][k]=e.target.value;k==="km"&&(runs[d][k]=Number(e.target.value||0));localStorage.setItem("isa-v5-runs",JSON.stringify(runs));renderAll()}));
}
let activeCode=schedule[currentDay]||"A";
function openStrength(c){activeCode=c;showTab("strength");renderStrength()}
function renderStrength(){
 const s=sessions[activeCode]; const key=`isa-v5-${selectedWeek}-${activeCode}`; const saved=JSON.parse(localStorage.getItem(key)||"{}");
 const loadPenalty=(activeCode==="B"||activeCode==="D") && ([2,3,4,5,6].some(d=>runLoad(d)>=3)) ? "Volume controlado devido à corrida da semana." : "Carga baseada no último registro; priorize técnica e RIR.";
 let html=`<div class="card"><div class="row"><div><div class="label">Sessão ${activeCode}</div><h2>${s.name}</h2></div><span class="badge blue">${s.level}</span></div><div class="notice">${loadPenalty}<br><b>Regra:</b> não treinar até a falha nos exercícios principais durante o ciclo de maratona.</div></div>`;
 s.ex.forEach((ex,idx)=>{
  const [name,sets,rep,def]=ex; const old=saved[idx]||{}; let inputs="";
  for(let i=0;i<sets;i++){inputs+=`<div class="set"><label>Rep ${i+1}</label><input type="number" min="0" value="${old["r"+i]??""}" data-ex="${idx}" data-field="r${i}"></div>`}
  html+=`<div class="card exercise"><div class="exercise-head"><div><h3>${name}</h3><div class="muted">${sets}× ${rep} · sugestão ${def?def+" kg":"peso corporal"}</div></div><span class="badge green">RIR 1–3</span></div><div class="sets">${inputs}</div><div class="formgrid" style="margin-top:8px"><div><label class="tiny">Carga usada (kg)</label><input type="number" step=".5" value="${old.load??def??""}" data-ex="${idx}" data-field="load"></div><div><label class="tiny">RIR final</label><input type="number" min="0" max="5" value="${old.rir??""}" data-ex="${idx}" data-field="rir"></div></div><textarea placeholder="Observação" data-ex="${idx}" data-field="note" style="margin-top:8px">${old.note||""}</textarea></div>`;
 });
 html+=`<button class="primary" onclick="saveStrength()">Salvar treino ${activeCode}</button><div style="height:10px"></div><button class="secondary" onclick="clearStrength()">Limpar registro desta sessão</button>`;
 document.getElementById("strength").innerHTML=html;
}
function saveStrength(){
 const key=`isa-v5-${selectedWeek}-${activeCode}`, data={};
 document.querySelectorAll("[data-ex]").forEach(el=>{const i=el.dataset.ex,f=el.dataset.field;data[i]=data[i]||{};data[i][f]=el.value});
 localStorage.setItem(key,JSON.stringify(data));
 alert("Treino salvo! As repetições e cargas ficam registradas neste aparelho.");
}
function clearStrength(){if(confirm("Apagar o registro desta sessão?")){localStorage.removeItem(`isa-v5-${selectedWeek}-${activeCode}`);renderStrength()}}
function renderHistory(){
 let html=`<div class="card"><h2>📈 Histórico</h2><div class="notice">Use o histórico para acompanhar carga, repetições e consistência. O app guarda os registros localmente no iPhone.</div></div>`;
 Object.keys(localStorage).filter(k=>k.startsWith("isa-v5-")&&!k.includes("week")&&!k.includes("runs")).sort().reverse().forEach(k=>{
   try{const data=JSON.parse(localStorage.getItem(k)); const m=k.match(/isa-v5-(\d+)-([A-E])/); if(!m)return; const code=m[2], count=Object.values(data).reduce((a,x)=>a+(x.load?1:0),0); html+=`<div class="day"><div class="row"><strong>Semana ${m[1]} · Treino ${code}</strong><span class="badge blue">${count} exercícios</span></div></div>`}catch(e){}
 });
 document.getElementById("history").innerHTML=html;
}
function showTab(tab){
 document.querySelectorAll("main>section").forEach(s=>s.classList.add("hidden"));
 document.getElementById(tab).classList.remove("hidden");
 document.querySelectorAll(".footerin button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
}
document.querySelectorAll(".footerin button").forEach(b=>b.onclick=()=>{showTab(b.dataset.tab);if(b.dataset.tab==="strength")renderStrength();if(b.dataset.tab==="run")renderRun();if(b.dataset.tab==="history")renderHistory()});
function renderAll(){renderNav();renderHome();renderRun();renderStrength();renderHistory();showTab("home")}
renderAll();
</script>
</body>
</html>
